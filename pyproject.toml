[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibridge-mcp"
version = "2.0.1"
description = "Multi-channel notification and signed webhook MCP server with SQLite WAL retry queue for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "claude", "cursor", "telegram", "discord", "notifications", "ai-agent"]
dependencies = [
    "httpx>=0.25.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
omnibridge-mcp = "omnibridge.server:main"
omnibridge-cli = "omnibridge.cli:main"

[tool.setuptools.packages.find]
include = ["omnibridge*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/omnibridge-mcp"
Documentation = "https://github.com/johannschiffer/omnibridge-mcp#readme"
Repository = "https://github.com/johannschiffer/omnibridge-mcp"
Issues = "https://github.com/johannschiffer/omnibridge-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"

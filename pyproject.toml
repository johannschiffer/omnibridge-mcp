[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibridge-mcp"
version = "1.0.1"
description = "Lightweight, resilient multi-channel notification and webhook MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "claude", "cursor", "telegram", "discord", "notifications", "ai-agent"]
dependencies = [
    "httpx>=0.25.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
omnibridge-mcp = "omnibridge.server:main"
omnibridge-cli = "omnibridge.cli:main"

[tool.setuptools.packages.find]
include = ["omnibridge*"]

[project.urls]
Homepage = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/omnibridge-mcp"
"Starter Kit" = "https://johanld.gumroad.com/l/genesis-starter-kit"
"Enterprise Suite" = "https://johanld.gumroad.com/l/genesis-enterprise-suite"
